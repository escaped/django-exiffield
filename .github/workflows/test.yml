name: Test & Lint

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }}, Django ${{ matrix.django }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django: ['5.2', '6.0', '6.1']
        exclude:
          - python-version: '3.10'
            django: '6.0'
          - python-version: '3.10'
            django: '6.1'
          - python-version: '3.11'
            django: '6.0'
          - python-version: '3.11'
            django: '6.1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install exiftool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl
      - name: Install dependencies
        run: |
          uv sync --locked
          uv pip install "django~=${{ matrix.django }}.0"
      - name: Test
        run: uv run --no-sync pytest
      - name: Generate coverage report
        run: uv run --no-sync coverage lcov -o coverage.lcov
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
          flag-name: py${{ matrix.python-version }}-dj${{ matrix.django }}
          parallel: true

  coveralls:
    name: Coveralls finished
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Finish Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Build the distribution
        run: uv build
      - name: Install and import the wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import exiffield; print(exiffield.__version__)"
