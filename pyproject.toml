[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-exiffield"
dynamic = ["version"]
description = "django-exiffield extracts exif information by utilizing the exiftool."
authors = [
    { name = "Alexander Frenzel", email = "alex@relatedworks.com" },
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "django>=5.2",
    "pillow>=5.0",
]

[project.urls]
Documentation = "https://github.com/escaped/django-exiffield/blob/master/README.md"
Homepage = "https://github.com/escaped/django-exiffield"
Repository = "https://github.com/escaped/django-exiffield"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-django>=4.9",
    "pytest-mock>=3.14",
    "ruff>=0.8",
]

[tool.hatch.version]
path = "exiffield/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["exiffield"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["exiffield", "tests"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
addopts = "--durations=10 --cov=exiffield --cov-report=term-missing"
testpaths = ["tests"]
norecursedirs = ["build", "dist"]

[tool.coverage.run]
branch = true
source = ["exiffield"]

[tool.coverage.report]
show_missing = true
omit = ["*/tests/*"]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
platform = "linux"
files = ["exiffield"]
ignore_missing_imports = true
